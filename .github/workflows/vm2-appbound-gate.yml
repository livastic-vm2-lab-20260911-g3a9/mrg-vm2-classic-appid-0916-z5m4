name: VM2 classic expected App gate

on:
  pull_request:
    branches:
      - appbound-base

permissions:
  contents: read

jobs:
  gate:
    name: vm2-appbound-gate
    runs-on: ubuntu-latest
    steps:
      - name: Expected GitHub Actions producer deliberately fails
        run: |
          echo VM2_EXPECTED_APP_FAILURE
          exit 1
